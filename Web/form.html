<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>意見反映表單</title>
</head>
<body style="background-color:#fffaf0; font-family:Arial, sans-serif; text-align:center;">
    <h1 style="color:#8b0000;">意見反映表單</h1>

    <form action="http://www.shiulihuang.idv.tw/utfdata.jsp" method="post" accept-charset="UTF-8" style="display:inline-block; text-align:left;">
        <label for="name">姓名:</label><br>
        <input type="text" id="name" name="name" size="40"><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" size="40"><br><br>

        <label for="message">意見內容：</label><br>
        <textarea id="message" name="message" rows="6" cols="42"></textarea><br><br>

        <input type="submit" value="送出">
        <input type="reset" value="清除">
    </form>

    <p style="margin-top:20px;">
        <a href="index.html" style="color:#0063c5;">回首頁</a>
    </p>
</body>
</html>
